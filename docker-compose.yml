services:
  simulator-api:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    container_name: buetcsefest-simulator-api
    environment:
      # Wall-clock ticks per second while the simulation is RUNNING.
      #
      # 0.5 -> one tick every 2 seconds.
      #
      # The runner sleeps `max(0.05, 1.0 / max(0.1, speed))`, so the `max(0.1,
      # ...)` divisor makes 0.1 the slowest reachable speed (a 10s tick) and
      # `max(0.05, ...)` floors the interval at 50ms (a 20 tick/s ceiling).
      # 0.5 sits comfortably inside that range.
      #
      # The backend's poll and staleness thresholds below were re-tuned for
      # this rate -- see the POLL_INTERVAL / STATE_MAX_AGE / SSE_STALE_AFTER
      # comments on the `backend` service.
      SIMULATION_SPEED: ${SIMULATION_SPEED:-0.5}
      # Simulated minutes advanced per tick. 15 = one quarter-hour of demand
      # per tick, matching the domain model's "15-minute tick clock".
      TICK_MINUTES: ${TICK_MINUTES:-15}
      # Start paused so tests drive ticks deterministically via /admin/step.
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - buet-net

  redis:
    image: redis:alpine
    container_name: buetcsefest-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - buet-net

  client-verifier:
    build:
      context: ./verifier
      dockerfile: Dockerfile
    container_name: buetcsefest-client-verifier
    depends_on:
      simulator-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SIMULATOR_BASE_URL: http://simulator-api:8000
      REDIS_URL: redis://redis:6379/0
      REPORT_PATH: /app/reports
      PYTHONUNBUFFERED: "1"
    ports:
      - "8001:8001"
    volumes:
      # Code is baked into the image (see verifier/Dockerfile). Only the
      # generated reports are persisted. No host bind-mount is used so the
      # stack works on Docker Desktop with paths containing spaces.
      - verifier-reports:/app/reports
    restart: unless-stopped
    command:
      - uvicorn
      - verify_api:app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - buet-net

  backend:
    build:
      # The project root is the context so the image can bake in the
      # reference client (verifier/simulator_client.py) that the drift guard
      # (tests/test_client_parity.py) compares against the backend's copy.
      context: .
      dockerfile: backend/Dockerfile
    container_name: buetcsefest-backend
    depends_on:
      simulator-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SIMULATOR_BASE_URL: http://simulator-api:8000
      REDIS_URL: redis://redis:6379/0
      BACKEND_PORT: "8002"
      # Seconds without an SSE event while the world has advanced -> suspected drop.
      #
      # Must comfortably exceed the simulator's tick interval (2s at
      # SIMULATION_SPEED=0.5). Events arrive once per tick, so a threshold
      # near the tick period would fire on a healthy but slow world. 9s gives
      # ~4 ticks of slack before a drop is even suspected.
      SSE_STALE_AFTER: "9"
      # Seconds of poller-only operation before we try to reclaim SSE.
      SSE_RECOVER_AFTER: "10"
      # Seconds between backend polls of the simulator. Set to half the tick
      # interval so the backend always has a recent snapshot without polling
      # faster than the world changes.
      POLL_INTERVAL: "1"
      WATCHDOG_INTERVAL: "1"
      # Force a fresh SSE subscription after this long, bounding the blast
      # radius of an undetected silent drop.
      SSE_MAX_LIFETIME: "900"
      # Seconds after which a snapshot is considered stale.
      #
      # MUST exceed POLL_INTERVAL. The snapshot can only ever be as fresh as
      # the poll that captured it, so a threshold *below* the poll interval
      # marks a perfectly healthy world stale for most of every poll cycle --
      # and the console renders a red "Stale data" banner on a system that is
      # working fine. 3s = three poll intervals of slack.
      STATE_MAX_AGE: "3"
      EVENT_BUFFER: "200"
      SUBSCRIBER_QUEUE: "64"
      JOURNAL_PATH: /app/data/journal.sqlite3
      PYTHONUNBUFFERED: "1"
    ports:
      - "8002:8002"
    volumes:
      # The dispatch journal lives on a named volume (NOT a host bind-mount --
      # Docker Desktop cannot mount this project's path, which contains spaces).
      - backend-journal:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8002/api/health',timeout=4)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - buet-net

  frontend:
    build:
      # The project root is the context so the Dockerfile can COPY
      # frontend/package.json and frontend/ without a host bind-mount
      # (Docker Desktop cannot mount this path -- it contains spaces).
      context: .
      dockerfile: frontend/Dockerfile
    container_name: buetcsefest-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: "8003"
      # The console proxies /api to the backend, so the browser needs no CORS
      # configuration and never learns the backend's internal hostname.
      BACKEND_ORIGIN: http://backend:8002
      NODE_ENV: production
    ports:
      - "8003:8003"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8003/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - buet-net

networks:
  buet-net:
    driver: bridge

volumes:
  verifier-reports:
  backend-journal:
